name: udiads_latin2
dataset_family: udiads

detection:
  data: ../configs/data/udiads_latin2_detect.yaml
  epochs: 300
  batch: 4
  imgsz: 1536
  lr0: 0.001
  patience: 100
  out_dir: ../../../80_models/02_2stage/u-diads-tl/detection/udiads_latin2
  variants:
    base: ../../../80_models/02_2stage/pretrained/yolov8n.pt
  selected_variant: base

segmentation:
  dataset_type: udiads_mask
  train_img_dir: ../../../00_data/U-DIADS-TL/Latin2/img-Latin2/train
  train_mask_dir: ../../../00_data/U-DIADS-TL/Latin2/text-line-gt-Latin2/training
  train_label_dir: ../../../00_data/U-DIADS-TL/yolo_dataset_latin2/labels/train
  val_img_dir: ../../../00_data/U-DIADS-TL/Latin2/img-Latin2/val
  val_mask_dir: ../../../00_data/U-DIADS-TL/Latin2/text-line-gt-Latin2/validation
  val_label_dir: ../../../00_data/U-DIADS-TL/yolo_dataset_latin2/labels/val
  test_img_dir: ../../../00_data/U-DIADS-TL/Latin2/img-Latin2/test
  test_mask_dir: ../../../00_data/U-DIADS-TL/Latin2/text-line-gt-Latin2/test
  test_label_dir: ../../../00_data/U-DIADS-TL/yolo_dataset_latin2/labels/test
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  batch: 8
  epochs: 30
  lr: 0.001
  resize: [256, 64]
  pad: 15
  out_dir: ../../../80_models/02_2stage/u-diads-tl/segmentation/udiads_latin2

prediction:
  yolo_variant: base
  test_img_dir: ../../../00_data/U-DIADS-TL/Latin2/img-Latin2/test
  out_instance_dir: ../../../99_evaluation/02_2stage/u-diads-tl/udiads_latin2/instance
  out_binary_dir: ../../../99_evaluation/02_2stage/u-diads-tl/udiads_latin2/binary
  out_overlay_dir: ../../../99_evaluation/02_2stage/u-diads-tl/udiads_latin2/overlay
  conf: 0.25
  bin_thresh: 0.5
  crop_pad: 15
  native_segm: true
  close_frac: 0.04
  resize_w: 256
  resize_h: 64

evaluation:
  udiads:
    pred_instance_dir: ../../../99_evaluation/02_2stage/u-diads-tl/udiads_latin2/instance
    gt_mask_dir: ../../../00_data/U-DIADS-TL/Latin2/text-line-gt-Latin2/test