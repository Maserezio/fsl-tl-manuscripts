# YOLOv8 detection with a ResNet-50 (torchvision, ImageNet-pretrained) backbone.
# Backbone emits the split feature list; Index pulls P3/P4/P5 (strides 8/16/32).
# ResNet-50 layer2/3/4 output channels are [512, 1024, 2048] (4x the ResNet-34 widths).
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, TorchVision, [2048, resnet50, DEFAULT, True, 2, True]]  # 0  split feature list
  - [0, 1, Index, [512, 6]]    # 1  P3/8   (layer2)
  - [0, 1, Index, [1024, 7]]   # 2  P4/16  (layer3)
  - [0, 1, Index, [2048, 8]]   # 3  P5/32  (layer4)

head:
  - [-1, 1, Conv, [512, 1, 1]]           # 4   (input = layer4, P5)
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 5
  - [[-1, 2], 1, Concat, [1]]            # 6   cat P4
  - [-1, 3, C2f, [512]]                  # 7

  - [-1, 1, Conv, [256, 1, 1]]           # 8
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 9
  - [[-1, 1], 1, Concat, [1]]            # 10  cat P3
  - [-1, 3, C2f, [256]]                  # 11  (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]           # 12
  - [[-1, 8], 1, Concat, [1]]            # 13  cat head P4
  - [-1, 3, C2f, [512]]                  # 14  (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]           # 15
  - [[-1, 4], 1, Concat, [1]]            # 16  cat head P5
  - [-1, 3, C2f, [1024]]                 # 17  (P5/32-large)

  - [[11, 14, 17], 1, Detect, [nc]]      # Detect(P3, P4, P5)
