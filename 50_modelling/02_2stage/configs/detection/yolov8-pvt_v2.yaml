# YOLOv8 detection with PVTv2-B2 (timm, ImageNet-1k pretrain).
# Channels at strides 8/16/32: [128, 320, 512]
#
# Unlike swin/hiera this backbone is size-dynamic, so no img_size pinning and no
# stride-probe stub are needed -- imgsz 1280 goes straight through.
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, TimmBackbone, [pvt_v2, 1024, false]]  # 0  returns [P3/8, P4/16, P5/32]
  - [0, 1, Index, [128, 0]]   # 1  P3/8
  - [0, 1, Index, [320, 1]]   # 2  P4/16
  - [0, 1, Index, [512, 2]]   # 3  P5/32

head:
  - [-1, 1, Conv, [512, 1, 1]]                # 4   (input = P5)
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 5
  - [[-1, 2], 1, Concat, [1]]                 # 6   cat P4
  - [-1, 3, C2f, [512]]                       # 7

  - [-1, 1, Conv, [320, 1, 1]]                # 8
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 9
  - [[-1, 1], 1, Concat, [1]]                 # 10  cat P3
  - [-1, 3, C2f, [320]]                       # 11  (P3/8 out)

  - [-1, 1, Conv, [320, 3, 2]]                # 12
  - [[-1, 8], 1, Concat, [1]]                 # 13  cat head P4
  - [-1, 3, C2f, [512]]                       # 14  (P4/16 out)

  - [-1, 1, Conv, [512, 3, 2]]                # 15
  - [[-1, 4], 1, Concat, [1]]                 # 16  cat head P5
  - [-1, 3, C2f, [1024]]                      # 17  (P5/32 out, doubled for deeper neck)

  - [[11, 14, 17], 1, Detect, [nc]]           # Detect(P3, P4, P5)
