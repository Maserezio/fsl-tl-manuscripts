# Size axis, U-DIADS, RANDOM-INIT arm.
#   encoder_weights: null  -> random init for smp/timm CNN + hierarchical ViT
#   pretrained: false      -> random init for flat ViTs going through hier_encoder
# Both keys are needed: they feed two different loaders. freeze_backbone must be
# false here, or the flat-ViT arm would train a frozen random backbone.
model:
  type: smp_unet
  encoder_name: resnet34
  encoder_weights: null
  pretrained: false
  freeze_backbone: false

supervoxel:
  enabled: false
  n_segments: 200
  compactness: 10
  sigma: 1
  lambda_sv: 0.1
  lambda_sv_u: 0.05
  lambda_boundary: 0.0

training:
  crop_size: 448
  batch_size: 4
  epochs: 200
  early_stopping_patience: 30
  lr: 0.001
  lr_backbone: 0.0001
  weight_decay: 0.0001
  amp: true
  vis_every: 5

data:
  data_root: ../00_data/U-DIADS-TL
  dataset_family: u_diads
  manuscript: Latin14396
  k_shot: 3
  selection_method: grayscale_variance
  num_workers: 4
